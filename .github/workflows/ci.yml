name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Check publication contents
        run: |
          python3 scripts/checks/test-publication.py
          python3 scripts/check-publication.py
      - name: Verify generated project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- booklife.xcodeproj Config
      - name: Test and build Apple targets
        run: bash scripts/check.sh
      - name: Select iPad Pro 11-inch simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/bookslide-simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'bookslide-simulators.json')) as source:
              devices = json.load(source)['devices']
          candidates = [device for runtime, group in sorted(devices.items(), reverse=True)
                        if 'iOS' in runtime for device in group
                        if device['name'].startswith('iPad Pro 11-inch') and device.get('isAvailable')]
          if not candidates:
              raise SystemExit('Install an iPad Pro 11-inch simulator to run the primary UI tests')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('BOOKSLIDE_IPAD_SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          PY
      - name: Test iPad reading, PencilKit and notes; clean simulator products
        run: bash scripts/check-simulator.sh
